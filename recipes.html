<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Raccolta delle ricette della Voidblock custom di Minecraft.">
    <script src="status.js"></script>
    <title>Recipes Voidblock Minecraft - Block Maps Changelogs</title>
    <link rel="icon" type="image/x-icon" href="images/icons/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lightbox.css">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
    <script src="markdown-security.js"></script>
    <script src="translate.js"></script>
    <script defer src="lightbox.js"></script>
    <script defer src="image-optimizer.js"></script>
    <script defer src="background-image-fallback.js"></script>
</head>
<body>
    <header>
        <h1 onclick="window.location.href='index.html'">Block Maps Changelogs</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="faq.html">FAQ</a>
        </nav>
    </header>

    <main>
        <div id="recipes-content" class="changelog" aria-live="polite">
            <p class="loading">Caricamento delle recipes...</p>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; <a href="license.html">LICENZE Loweredgames</a> - Tutti i diritti riservati.</p>
        </div>
    </footer>

    <script>
        async function loadRecipes() {
            const content = document.getElementById('recipes-content');

            try {
                const response = await fetch('recipes.md');
                if (!response.ok) {
                    throw new Error(`Errore nel caricamento: ${response.status}`);
                }

                content.innerHTML = renderMarkdown(await response.text());
                content.querySelectorAll('img').forEach(image => {
                    image.style.maxWidth = '100%';
                    image.style.height = 'auto';
                    image.loading = 'lazy';
                    image.decoding = 'async';
                });
            } catch (error) {
                console.error('Errore nel caricamento delle recipes:', error);
                content.innerHTML = `
                    <div class="error-message">
                        <h2>Errore nel caricamento delle recipes</h2>
                        <p>Non è stato possibile caricare la pagina. Riprova più tardi.</p>
                        <a href="index.html" class="error-button">Torna alla home</a>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadRecipes);
    </script>
</body>
</html>
